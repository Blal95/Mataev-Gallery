name = "mataev-gallery"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gallery-photos"
remote = true

# Incremental (ISR) cache for rendered pages. Kept in a separate bucket from
# the public photos bucket so cached HTML is never exposed on cdn.gallery.mataev.no.
# Create once with: wrangler r2 bucket create gallery-cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "gallery-cache"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "gallery"
database_id = "fb34ab35-93ff-4694-a1f1-72dc42ea49d4"
remote = true

[vars]
NEXT_PUBLIC_CDN_BASE = "https://cdn.gallery.mataev.no"
RP_ID = "gallery.mataev.no"
RP_ORIGIN = "https://gallery.mataev.no"
ALLOWED_ORIGINS = "https://mataev.no,https://www.mataev.no,http://localhost:3000,http://localhost:3001"
